name: "Explainable Neural Computing Lab"
title: "Explainable Neural Computing Lab | Sookmyung Women's University"
description: "Explainable Neural Computing Lab at Sookmyung Women's University. Research in explainable neural computing, statistical learning, forecasting, time-series, and narrative text data."
url: "https://seo-beomseok.github.io"
baseurl: ""
repository: "seo-beomseok/seo-beomseok.github.io"
timezone: Asia/Seoul

markdown: kramdown
highlighter: rouge
permalink: /:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - Gemfile.lock
  - vendor
  - node_modules
  - README.md
  - LICENSE
  - preview.html
  - preview_novideo.html
